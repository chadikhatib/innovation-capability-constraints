1. Executive Summary & Verification Overview
This document provides the formal data integrity audit and automated reproducibility verification record for the analytical dataset Deidentified_Dataset_N303.csv (N = 303) and associated Python scripts (reproducible_statistical_audit.py and Innovation_Capability_Analysis.py). The entire computational pipeline was executed under Python 3.12 in an air-gapped, deterministic environment to ensure zero discrepancy between archived data and published manuscript figures.
2. GitHub Actions CI/CD Workflow Specification (.github/workflows/reproducibility.yml)
The automated continuous integration workflow enforces continuous reproducibility checks on every repository commit. The YAML specification below defines the complete automated testing steps:
name: Reproducibility and Data Integrity Check
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify script syntax
        run: |
          python -m py_compile reproducible_statistical_audit.py
          python -m py_compile code/Innovation_Capability_Analysis.py

      - name: Verify data integrity & sample size
        run: |
          python - <<'PYTHON'
          import pandas as pd
          df = pd.read_csv("data/Deidentified_Dataset_N303.csv")
          assert len(df) == 303, f"Expected 303 observations, found {len(df)}"
          
          required_columns = ["PILS_pct", "IAI_pct", "IRS_pct", "IPI_pct", "Diagnostic_Gap", "Gender", "Category", "Experience_Level"]
          missing = [c for c in required_columns if c not in df.columns]
          assert len(missing) == 0, f"Missing required columns: {missing}"
          
          for col in required_columns:
              assert df[col].notna().all(), f"Missing values detected in {col}"
          
          # Demographic assertions
          assert (df['Gender'] == 1).sum() == 215, "Female count mismatch"
          assert (df['Gender'] == 0).sum() == 88, "Male count mismatch"
          assert (df['Category'] == 0).sum() == 224, "Student count mismatch"
          assert (df['Category'] == 1).sum() == 54, "Academic count mismatch"
          assert (df['Category'] == 2).sum() == 25, "Pharmacist count mismatch"
          
          print("✅ Dataset integrity & demographics verified successfully")
          print(f"✅ Sample size verified: N = {len(df)}")
          PYTHON

      - name: Run full reproducible statistical audit
        run: |
          python reproducible_statistical_audit.py

      - name: Run full analysis pipeline
        run: |
          mkdir -p results
          python code/Innovation_Capability_Analysis.py \
            --data data/Deidentified_Dataset_N303.csv \
            --output results/

      - name: Verify generated analytical outputs
        run: |
          echo "Generated analytical files:"
          ls -lah results/
          test -f results/S2_descriptive_stats.csv
          test -f results/S4_correlation_matrix.csv
          test -f results/S5_specification_A.csv
          test -f results/S5_specification_B.csv
          test -f results/S6_nested_model_comparison.csv
          test -f results/S7_sensitivity_analysis.csv
          test -f results/S8_convergent_validity.csv
          echo "✅ All required analytical outputs generated successfully"

      - name: Upload reproducibility results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-results
          path: results/

      - name: Workflow summary
        if: success()
        run: |
          echo "======================================="
          echo "REPRODUCIBILITY & DATA INTEGRITY CHECK PASSED"
          echo "======================================="
          echo "Dataset: Deidentified_Dataset_N303.csv"
          echo "Sample size: N = 303 (100% verified)"
          echo "Python version: ${{ matrix.python-version }}"
          echo "Status: ALL CHECKS PASSED SUCCESSFULLY"
          echo "======================================="

